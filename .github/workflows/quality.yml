name: quality
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  source-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:verify
      - name: Verify Journey behavior
        run: |
          npm run journey:a2:test
          npm run journey:h1709:move:test
          npm run journey:h1709:test
          npm run journey:h1709:p3:test
          npm run journey:layout:test
      - name: Upload reproducible dist
        uses: actions/upload-artifact@v4
        with:
          name: blue-ocean-dist-${{ github.sha }}
          path: dist

  e2e-visual:
    runs-on: ubuntu-latest
    needs: source-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - run: npm run e2e:visual
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blue-ocean-visual-${{ github.sha }}
          path: artifacts/e2e-v1162

  editor-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run editor:selection:test
      - run: npm run build
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm run editor:browser
      - run: npm run journey:browser
      - name: Upload editor UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blue-ocean-editor-${{ github.sha }}
          path: |
            artifacts/editor-ux
            artifacts/journey-editor
