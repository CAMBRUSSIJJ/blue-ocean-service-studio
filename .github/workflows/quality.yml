name: Qualidade
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-build:
    name: Código-fonte, contratos e build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: node scripts/journey-visualization-test.mjs
      - run: node scripts/blueprint-guided-reading-test.mjs
      - run: npm run release:verify
      - name: Verificar comportamento da Jornada
        run: |
          npm run journey:a2:test
          npm run journey:h1709:move:test
          npm run journey:h1709:test
          npm run journey:h1709:p3:test
          npm run journey:layout:test
      - name: Armazenar distribuição validada
        uses: actions/upload-artifact@v4
        with:
          name: blue-ocean-dist-${{ github.sha }}
          path: dist
          retention-days: 7

  e2e-visual:
    name: Verificação visual
    runs-on: ubuntu-latest
    needs: source-and-build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Recuperar distribuição validada
        uses: actions/download-artifact@v4
        with:
          name: blue-ocean-dist-${{ github.sha }}
          path: dist
      - run: python -m pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - run: npm run e2e:visual
      - name: Armazenar evidências visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blue-ocean-visual-${{ github.sha }}
          path: artifacts/e2e-v1162
          retention-days: 14

  editor-ux:
    name: Fluxos dos editores no navegador
    runs-on: ubuntu-latest
    needs: source-and-build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run editor:selection:test
      - name: Recuperar distribuição validada
        uses: actions/download-artifact@v4
        with:
          name: blue-ocean-dist-${{ github.sha }}
          path: dist
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm run editor:browser
      - run: npm run journey:browser
      - run: npm run blueprint:methodology:browser
      - run: python3 scripts/blueprint-guided-reading-browser.py
      - run: python3 scripts/blueprint-reference-exact-browser.py
      - run: python3 scripts/journey-primary-reference-browser.py
      - run: python3 scripts/unified-journey-browser.py
      - run: python3 scripts/journey-progressive-browser.py
      - run: npm run journey:growth:browser
      - run: npm run journey:content:browser
      - run: npm run journey:picker:browser
      - run: npm run journey:elements:browser
      - run: npm run journey:context:browser
      - run: npm run journey:observation:browser
      - run: npm run entry:browser
      - run: npm run product:browser
      - run: npm run maps:browser
      - name: Verificar Jornada, modelos e Whiteboard no Chromium
        run: python3 scripts/h1710-journey-template-whiteboard-browser.py
      - name: Armazenar evidências dos editores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blue-ocean-editor-${{ github.sha }}
          retention-days: 14
          path: |
            artifacts/editor-ux
            artifacts/journey-editor
            artifacts/blueprint-methodology
            artifacts/entry-journey
            artifacts/journey-template-whiteboard
            artifacts/product-experience
            artifacts/map-actions
            artifacts/blueprint-reference-exact
            artifacts/journey-progressive
            artifacts/journey-growth
            artifacts/journey-content
            artifacts/journey-picker
            artifacts/journey-elements
            artifacts/journey-context
            artifacts/journey-observation
