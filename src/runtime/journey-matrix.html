<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue Ocean · Blueprint de Serviço</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fb;--sf:#fff;--ink:#0f1b2d;--mut:#51607a;--ln:#e1e7f1;--ac:#1f5eff;--onac:#fff;--acs:#e8f0ff;--act:#0b3fb5;--cd:#f1f5fc;--pn:#fff1ea;--pnt:#7a3210}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--sf:#121b2e;--ink:#e8edf7;--mut:#a3b0c8;--ln:#24324d;--ac:#5b8cff;--onac:#0b1220;--acs:#1a2a52;--act:#a9c3ff;--cd:#192640;--pn:#3a2118;--pnt:#ffc5a8}}
:root[data-theme="dark"]{--bg:#0b1220;--sf:#121b2e;--ink:#e8edf7;--mut:#a3b0c8;--ln:#24324d;--ac:#5b8cff;--onac:#0b1220;--acs:#1a2a52;--act:#a9c3ff;--cd:#192640;--pn:#3a2118;--pnt:#ffc5a8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
button,select,input{font:inherit;color:var(--ink)}button{cursor:pointer}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:18px 24px 8px}
.bk{width:100%;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--act)}
.ti{flex:1 1 280px;font-size:22px;font-weight:600;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px}
.ti:hover,.ti:focus{border-color:var(--ln);background:var(--sf)}
.pi{margin:0 24px 12px;width:calc(100% - 48px);max-width:560px;font-size:13px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 12px}
.sv{font-size:12px;color:var(--mut)}
.tb{font-size:13px;font-weight:600;background:var(--sf);border:1px solid var(--ln);border-radius:8px;min-height:44px;padding:0 14px}
.tb.p{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.tb[aria-pressed=true]{background:var(--acs);border-color:var(--ac);color:var(--act)}
.wrap{display:flex;flex-wrap:wrap;gap:16px;padding:0 24px 32px;align-items:flex-start}
.bd{flex:1 1 760px;min-width:0;overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:12px}
.r{display:grid;grid-template-columns:var(--cols)}
.lb{position:sticky;left:0;z-index:1;background:var(--sf);padding:16px;font-size:13px;font-weight:600}
.lb small{display:block;margin-top:2px;font-size:12px;font-weight:400;color:var(--mut)}
.c{padding:8px;border-top:1px solid var(--ln);min-width:0}
.n,.tx,.sn{outline:none}
.n{background:var(--cd);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:6px;min-height:44px}
.n:empty::before,.tx:empty::before{content:"Escreva…";color:var(--mut)}
.n:focus,.tx:focus,.sn:focus{box-shadow:0 0 0 2px var(--ac)}
.ad{width:100%;min-height:36px;border:1.5px dashed var(--ln);border-radius:8px;background:transparent;color:var(--act);font-size:13px}
.dv{display:flex;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid var(--ln);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.dv::after{content:"";flex:1;border-top:1.5px dashed var(--mut);opacity:.5}
.sh{display:flex;align-items:center;gap:8px;padding:14px 8px}
.sh i{flex:none;font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--ac);color:var(--onac);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sn{flex:1;font-weight:600;font-size:14px;border-radius:4px;padding:2px 4px}
.x{border:0;background:transparent;color:var(--mut);min-width:32px;min-height:32px;border-radius:6px;font-size:16px}
.cvb{position:relative;height:110px}
.cvb svg{position:absolute;inset:0;width:100%;height:100%}
.dt{position:absolute;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--ac)}
.dl{position:absolute;transform:translateX(-50%);font-size:12px;color:var(--mut);white-space:nowrap}
.sl{display:grid;padding:4px 0 2px}
.sl input{width:80%;margin:0 10%;min-height:24px;accent-color:var(--ac)}
.it{border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.it.d{background:var(--pn);color:var(--pnt)}.it.i{background:var(--acs);color:var(--act)}
.it b{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.mt{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mt button,.mt select{font-size:12px;background:var(--sf);border:1px solid var(--ln);border-radius:6px;min-height:32px;padding:0 8px}
.bt{display:flex;gap:6px}.bt button{flex:1;min-height:36px;font-size:12px;font-weight:600;border:1.5px dashed var(--ln);background:transparent;border-radius:8px}
.pnl{flex:1 1 300px;max-width:420px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:18px}
.pnl h2{margin:0 0 10px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.pnl h2:not(:first-child){margin-top:22px}
.rk{margin-bottom:10px;font-size:13px}.rk div:first-child{display:flex;justify-content:space-between;gap:8px}.rk span{color:var(--mut)}
.bar{height:6px;border-radius:3px;background:var(--cd);margin-top:4px}.bar i{display:block;height:100%;border-radius:3px;background:var(--ac)}
.ins{background:var(--acs);color:var(--act);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.hint{font-size:12px;color:var(--mut);margin:14px 0 0}
.tb:disabled{opacity:.5;cursor:not-allowed}
.sh{flex-wrap:wrap}.sa{display:flex;flex:none;width:calc(100% - 30px);margin-left:30px}.sa .x{min-width:30px}.x:disabled{opacity:.3;cursor:default}
.nw{position:relative;display:flex;align-items:flex-start;gap:2px;margin-bottom:6px}.nw .n{flex:1;margin:0}
.gh{cursor:grab;color:var(--mut);padding:10px 0;width:14px;text-align:center;user-select:none;line-height:1;font-size:14px}
.nx{position:absolute;top:-8px;min-width:28px;min-height:28px;font-size:12px;border:1px solid var(--ln);background:var(--sf);border-radius:6px;opacity:0;padding:0}.nx.a{right:24px}.nx.b{right:-4px}
.nw:hover .nx,.nw:focus-within .nx{opacity:1}@media(hover:none){.nx{opacity:1}}
.c.ov{outline:2px dashed var(--ac);outline-offset:-2px}
.lk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.nx.c{right:52px;opacity:1}.nw.pk .n{box-shadow:0 0 0 2px var(--ac)}
.h1{width:100%;margin:0;font-size:26px}
.st{max-width:720px;margin:0 auto;padding:8px 24px 40px;display:grid;gap:16px}
.st section{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:20px;display:grid;gap:12px}
.st h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.st label{display:grid;gap:6px;font-size:13px;font-weight:600}
.st input{font-size:14px;font-weight:400;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:11px 12px;min-height:44px}
.chips,.row{display:flex;flex-wrap:wrap;gap:8px}
.row input{flex:1 1 220px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-size:13px}
.chip[aria-pressed=true]{background:var(--acs);border-color:var(--ac);color:var(--act);font-weight:600}
.sg{display:block;width:100%;text-align:left;margin-bottom:6px;min-height:36px;padding:8px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--act);font-size:13px}
.ck{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:var(--mut)}
.ck span{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.ck.on{color:var(--ink);font-weight:600}.ck.on span{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.ck em{margin-left:auto;font-style:normal;font-size:12px}
</style>

<script>
const HOSTED=new URLSearchParams(location.search).get('service-graph')==='1';let applyingHost=false;
const KEY='bo-blueprint-v1',DIMS=['Tangíveis','Confiabilidade','Presteza','Segurança','Empatia'],EM=['Frustrada','Ansiosa','Neutra','Animada','Satisfeita'];
const LANES=[{id:'ev',n:'Evidência física',h:'O que o cliente vê ou toca'},{id:'ac',n:'Ações do cliente',h:'O que a pessoa faz'},{id:'em',n:'Emoções',h:'Como ela se sente',emo:1},{id:'fl',n:'Linha de frente',h:'Ações visíveis da equipe',d:'Linha de interação'},{id:'bk',n:'Bastidores',h:'Ações que o cliente não vê',d:'Linha de visibilidade',o:1},{id:'sy',n:'Sistemas e apoio',h:'Ferramentas e processos',d:'Linha de interação interna',o:1}];
const seed=()=>({title:'Pedido de café para retirar',persona:'Marina, trabalha em home office · pede pelo app e retira no balcão',steps:[{n:'Descobrir',e:1,d:'Marina vê o café nas redes sociais e decide pedir.'},{n:'Pedir',e:-1,d:'Ela monta o pedido no app e paga com Pix.'},{n:'Retirar',e:-2,d:'Ela vai ao balcão e espera o pedido ficar pronto.'},{n:'Avaliar',e:2,d:'Depois, responde à pesquisa e recebe um cupom.'}],
c:{'ev|0':['Cardápio no Instagram'],'ev|1':['Tela do app de pedidos'],'ev|2':['Copo com o nome da cliente'],'ev|3':['Cupom por e-mail'],'ac|0':['Vê o cardápio e escolhe a bebida'],'ac|1':['Faz o pedido e paga com Pix'],'ac|2':['Chega ao balcão e retira'],'ac|3':['Responde à pesquisa'],'fl|0':['Responde dúvidas no direct'],'fl|1':['Confirma o pedido no tablet'],'fl|2':['Chama a cliente pelo nome'],'fl|3':['Envia a pesquisa por e-mail'],'bk|0':['Atualiza o cardápio do dia'],'bk|1':['Barista recebe o ticket impresso'],'bk|2':['Prepara e confere o pedido'],'bk|3':['Analisa as avaliações da semana'],'sy|0':['Instagram e planilha de estoque'],'sy|1':['App de pedidos e Pix'],'sy|2':['Impressora de tickets'],'sy|3':['CRM de clientes']},
iss:[{s:1,t:'d',x:'Pix às vezes falha sem aviso',v:2,d:1},{s:2,t:'d',x:'Espera sem estimativa',v:3,d:2},{s:2,t:'i',x:'Avisar quando o pedido ficar pronto',v:0,d:2},{s:3,t:'i',x:'Cupom na segunda compra',v:0,d:4}]});
const blank=()=>({title:'',persona:'',steps:[],c:{},iss:[],start:1});
const DEF=['Descobrir','Escolher','Pedir e pagar','Aguardar','Retirar','Avaliar'];
const newST=()=>({title:'',persona:'',new:'',steps:DEF.map(n=>({n,on:1}))});
let ST=newST();
const PR={ev:'O que o cliente vê ou toca?',ac:'O que o cliente faz neste momento?',fl:'O que a equipe faz à vista?',bk:'O que acontece por trás?',sy:'Que ferramenta apoia?',go:'O que buscamos nesta etapa?',ch:'Por qual canal o cliente chega?',pr:'Qual promessa comunicamos?',br:'O que impede o cliente de avançar?',rr:'O que incentiva o retorno ou a indicação?',ki:'Qual indicador ajuda a avaliar esta etapa?'};
const SG={'descobrir':{ev:['Cardápio no Instagram','Placa na porta'],ac:['Vê uma foto ou indicação'],fl:['Responde dúvidas no direct'],bk:['Atualiza o cardápio do dia'],sy:['Instagram e planilha de estoque']},
'escolher':{ev:['Cardápio digital'],ac:['Compara bebidas e preços','Escolhe a bebida'],fl:['Sugere o item do dia'],bk:['Confere o estoque de ingredientes'],sy:['App de pedidos']},
'pedir e pagar':{ev:['Tela do app','Comprovante de pagamento'],ac:['Monta o pedido','Paga com Pix ou cartão'],fl:['Confirma o pedido no tablet'],bk:['Barista recebe o ticket'],sy:['Gateway de pagamento','Impressora de tickets']},
'aguardar':{ev:['Notificação do app','Senha do pedido'],ac:['Acompanha o status do pedido'],fl:['Informa o tempo restante'],bk:['Prepara e confere o pedido'],sy:['Painel de pedidos']},
'retirar':{ev:['Copo com o nome da cliente','Balcão de retirada'],ac:['Chega ao balcão e retira'],fl:['Chama a cliente pelo nome'],bk:['Separa o pedido pronto'],sy:['Painel de pedidos']},
'avaliar':{ev:['Cupom ou pesquisa por e-mail'],ac:['Responde à pesquisa de satisfação'],fl:['Agradece e convida a voltar'],bk:['Analisa as avaliações da semana'],sy:['CRM de clientes']}};
function sug(l,i,a){if(HOSTED||!S.guide)return '';const g=((SG[S.steps[i].n.toLowerCase()]||{})[l]||[]).map((t,n)=>[t,n]).filter(x=>!a.some(n=>n.t==x[0]));return g.map(x=>'<button class="sg" data-act="sg" data-l="'+l+'" data-i="'+i+'" data-n="'+x[1]+'">+ '+esc(x[0])+'</button>').join('')}
function chk(){const b=document.getElementById('go');if(!b)return;const on=ST.steps.filter(s=>s.on).length;b.disabled=!ST.title.trim()||on<2;b.textContent='Criar blueprint ('+on+' etapas)'}
function startScreen(){return '<div class="hd"><div class="bk">Blue Ocean · '+(HOSTED?'Jornada':'Blueprint de serviço')+'</div><h1 class="h1">Vamos montar um blueprint</h1></div><div class="st"><section><h2>1 · Quem e o quê</h2><label>O que o cliente quer fazer?<input data-f="st:title" value="'+esc(ST.title)+'" placeholder="Ex.: Pedir um café para retirar"></label><label>Quem é o cliente e em que contexto?<input data-f="st:persona" value="'+esc(ST.persona)+'" placeholder="Ex.: Marina, trabalha em home office e tem pouco tempo"></label><div class="row"><button class="tb" data-act="ex">Preencher com o exemplo do café</button></div></section><section><h2>2 · Etapas da jornada</h2><p class="hint" style="margin:0">Um momento por etapa, na ordem em que o cliente vive. Desmarque o que não se aplica ou adicione as suas.</p><div class="chips">'+ST.steps.map((s,i)=>'<button class="chip" data-act="chip" data-i="'+i+'" aria-pressed="'+!!s.on+'">'+(s.on?'✓ ':'')+esc(s.n)+'</button>').join('')+'</div><div class="row"><input data-f="st:new" placeholder="Nova etapa, ex.: Receber o cupom" aria-label="Nova etapa" value="'+esc(ST.new)+'"><button class="tb" data-act="addst">Adicionar</button></div></section><div class="row"><button class="tb p" id="go" data-act="go">Criar blueprint</button><button class="tb" data-act="demo">Ver exemplo pronto</button><button class="tb" data-act="lib">Minhas jornadas</button>'+(HOSTED?'<button class="tb" data-act="tools">Ferramentas</button>':'')+'</div><p class="hint" style="margin:0">Dê um nome à jornada e escolha ao menos 2 etapas. Depois, o painel lateral guia o que preencher em cada faixa e sugere ideias para as etapas conhecidas.</p></div>'}
function coach(){
const rows=orderedRows().filter(r=>!V.hiddenRows.includes(r.id)),N=S.steps.length;
const count=r=>r.id==='sd'?S.steps.filter(s=>s.d?.trim()).length:r.id==='em'?S.steps.filter(growthEmotionKnown).length:r.id==='im'?new Set(S.iss.map(x=>x.s)).size:S.steps.filter((_,i)=>(S.c[r.id+'|'+i]||[]).some(n=>n.t?.trim())).length;
const progress=rows.map(r=>({...r,count:count(r)})),next=progress.find(r=>r.count<N);
return '<h2>Passo a passo</h2>'+progress.map((r,i)=>'<div class="ck'+(r===next?' on':'')+'"><span>'+(r.count===N&&N?'✓':i+1)+'</span>'+esc(r.n)+'<em>'+r.count+' de '+N+'</em></div>').join('')+'<div class="ins">'+(!N?'Adicione a primeira etapa para começar.':next?'Próximo: “'+esc(next.n)+'”. Complete as etapas que faltam.':'As faixas visíveis estão preenchidas. Revise o mapa com sua equipe.')+'</div><p class="hint">Progresso das faixas visíveis. Uma emoção neutra registrada também conta.</p>';
}
const KEY2='bo-blueprint-v2',uid=()=>Math.random().toString(36).slice(2,9);
let lk=false,pick=null,DB,S,cv=false,armed=false,lib=false,dr='',msg='',U=[],R=[],last='',lt=0;
let V=null,H={canUndo:false,canRedo:false},emotionEdit=null,expandedNotes=new Set(),saveLabel=HOSTED?'Carregando…':'Salvo neste navegador';
const STANDARD_ROWS=[{id:'sd',n:'Contexto da etapa',h:'Situação vivida pelo cliente'},...LANES,{id:'im',n:'Dores e ideias',h:'Problemas e oportunidades'}];
const ACQUISITION_LANES=[{id:'go',n:'Objetivo da etapa',h:'Resultado que buscamos'},{id:'ch',n:'Canais de aquisição',h:'Como o cliente chega'},{id:'pr',n:'Promessa e mensagem',h:'O que comunicamos'},{id:'br',n:'Barreiras à contratação',h:'Dúvidas e objeções'},{id:'rr',n:'Retorno e indicação',h:'Relacionamento e retenção'},{id:'ki',n:'Indicador da etapa',h:'Como avaliar esta experiência'}];
const BASE_ROWS=[...STANDARD_ROWS,...ACQUISITION_LANES];
const PRESETS={essential:['sd','ac','em'],detailed:['sd','ev','ac','em','im'],operational:STANDARD_ROWS.map(r=>r.id),acquisition:['sd','ac','go','ch','pr','br','rr','ki','im'],complete:BASE_ROWS.map(r=>r.id)};
const PRESET_NAMES={essential:'Jornada essencial',detailed:'Jornada detalhada',operational:'Visão operacional',acquisition:'Aquisição e relacionamento',complete:'Matriz completa',custom:'Visualização personalizada'};
const rowDefs=()=>contentRowDefs();
function viewState(input){
  const preset=Object.hasOwn(PRESETS,input?.preset)?input.preset:input?.preset==='custom'?'custom':S.editorKind==='blueprint'?'operational':'essential';
  let hiddenRows=Array.isArray(input?.hiddenRows)?input.hiddenRows.filter(x=>typeof x==='string'):BASE_ROWS.filter(r=>!PRESETS[preset]?.includes(r.id)).map(r=>r.id);
  if(input&&!input.rowOrder?.includes('go')&&!['complete','acquisition'].includes(preset))hiddenRows=[...new Set([...hiddenRows,...ACQUISITION_LANES.map(r=>r.id)])];
  return {version:1,preset,perspective:input?.perspective==='blueprint'||!input?.perspective&&preset==='operational'?'blueprint':'journey',hiddenRows,rowOrder:Array.isArray(input?.rowOrder)?[...new Set(input.rowOrder.filter(x=>typeof x==='string'))]:BASE_ROWS.map(r=>r.id),insightsOpen:input?.insightsOpen===true,insightsTab:['guidance','analysis','quality'].includes(input?.insightsTab)?input.insightsTab:'guidance',emotionsExpanded:input?.emotionsExpanded===true,fitToScreen:input?.fitToScreen===true,
 zoom:Number.isFinite(+input?.zoom)?Math.max(75,Math.min(150,Math.round(+input.zoom))):100,
 stageWidths:Array.isArray(input?.stageWidths)?input.stageWidths.slice(0,100).map(w=>Number.isFinite(+w)?Math.max(210,Math.min(600,Math.round(+w))):290):[],
 rowHeights:input?.rowHeights&&typeof input.rowHeights==='object'&&!Array.isArray(input.rowHeights)?Object.fromEntries(Object.entries(input.rowHeights).filter(([id])=>/^[a-z][a-z0-9]{0,24}$/.test(id)).map(([id,v])=>[id,Math.max(76,Math.min(540,Math.round(Number(v)||110)))])): {},
 collapsedRows:Array.isArray(input?.collapsedRows)?input.collapsedRows.filter(id=>typeof id==='string'):[],
 cardFilters:window.BlueOceanJourneyContent.normalizeMatrixCardFilters(input?.cardFilters)};
}

const stageWidth=i=>V.stageWidths?.[i]||290;
function mapGridStyle(count,preview=null){
 const max=count<=2?440:320,widths=V.stageWidths||[],hasCustom=widths.some((n,i)=>i<count&&Number.isFinite(n));
 const style='--stage-count:'+Math.max(1,count)+';--stage-max:'+max+'px;--map-zoom:'+(V.zoom||100)/100+';';
 if(!hasCustom&&!preview)return style;
 const px=Array.from({length:count},(_,i)=>preview?.i===i?preview.width:(preview?.widths?.[i]||stageWidth(i)));
 const total=320+px.reduce((a,b)=>a+b,0);
 return style+'--cols:180px '+px.map(w=>Math.max(210,Math.min(600,w))+'px').join(' ')+' 140px;min-width:'+total+'px;width:max(100%,'+total+'px);';
}
function resizeMatrixPreview(preview){
 const matrix=app.querySelector('.matrix');if(!matrix)return;
 const copy=document.createElement('div');copy.style.cssText=mapGridStyle(S.steps.length,preview);
 for(const key of ['--cols','--stage-count','--stage-max','--map-zoom'])matrix.style.setProperty(key,copy.style.getPropertyValue(key));
 matrix.style.minWidth=copy.style.minWidth;matrix.style.width=copy.style.width;requestAnimationFrame(drawLinks);
}
function moveLane(id,delta,focus=true){
 const ids=orderedRows().map(row=>row.id),i=ids.indexOf(id),j=i+delta;if(i<0||j<0||j>=ids.length)return;
 [ids[i],ids[j]]=[ids[j],ids[i]];V.rowOrder=ids;V.preset='custom';saveView();rerender();
 if(focus)focusNew('[data-lane-handle="'+id+'"]');
}
function orderedRows(){const rows=rowDefs();return [...V.rowOrder.map(id=>rows.find(r=>r.id===id)).filter(Boolean),...rows.filter(r=>!V.rowOrder.includes(r.id))]}
function saveView(){
  if(HOSTED){saveLabel='Salvando…';window.parent.postMessage({boBlueprintHost:1,type:'preferences',view:V},location.origin)}

app.addEventListener('drop',e=>{if(laneDrag){e.preventDefault();const id=e.target.closest?.('.r[data-row]')?.dataset.row;applyLaneDrop(id);laneDrag=null;app.querySelectorAll('.lane-drop-target').forEach(node=>node.classList.remove('lane-drop-target'));return}const c=e.target.closest('[data-cell]');if(!dg||!c)return;e.preventDefault();const k2=c.dataset.cell;if(k2.split('|')[0]!=dg.k.split('|')[0]){dg=null;return}const w=e.target.closest('.nw'),dst=S.c[k2]=S.c[k2]||[];let j2=w?+w.dataset.j:dst.length;const t=S.c[dg.k].splice(dg.j,1)[0];if(k2==dg.k&&dg.j<j2)j2--;dst.splice(j2,0,t);dg=null;save();render()});
app.addEventListener('dragend',()=>{laneDrag=null;app.querySelectorAll('.lane-drop-target').forEach(node=>node.classList.remove('lane-drop-target'));dg=null;app.querySelectorAll('.ov').forEach(x=>x.classList.remove('ov'))});
function drawLinks(){const sv=document.getElementById('lk');if(!sv)return;const o=sv.getBoundingClientRect(),P=el=>{const r=el.getBoundingClientRect();return{l:r.left-o.left,r:r.right-o.left,t:r.top-o.top,b:r.bottom-o.top}};
let h='<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--ac)"/></marker></defs>';
(S.links||[]).forEach((l,n)=>{const A=app.querySelector('.nw[data-nid="'+l.a+'"]'),B=app.querySelector('.nw[data-nid="'+l.b+'"]');if(!A||!B)return;const a=P(A),b=P(B),dx=(b.l+b.r)/2-(a.l+a.r)/2,dy=(b.t+b.b)/2-(a.t+a.b)/2;let x1,y1,x2,y2,c1,c2;
if(Math.abs(dy)>Math.abs(dx)*.3){const dn=dy>0;x1=(a.l+a.r)/2;x2=(b.l+b.r)/2;y1=dn?a.b:a.t;y2=dn?b.t:b.b;const k=Math.max(30,Math.abs(y2-y1)/2)*(dn?1:-1);c1=[x1,y1+k];c2=[x2,y2-k]}
else{const rt=dx>0;y1=(a.t+a.b)/2;y2=(b.t+b.b)/2;x1=rt?a.r:a.l;x2=rt?b.l:b.r;const k=Math.max(30,Math.abs(x2-x1)/2)*(rt?1:-1);c1=[x1+k,y1];c2=[x2-k,y2]}
const d='M'+x1+' '+y1+' C'+c1.join(' ')+' '+c2.join(' ')+' '+x2+' '+y2;
h+='<path d="'+d+'" fill="none" style="stroke:var(--ac)" stroke-width="1.75" marker-end="url(#ar)"/><path d="'+d+'" fill="none" stroke="transparent" stroke-width="14" style="pointer-events:stroke;cursor:pointer" data-act="ul" data-n="'+n+'"><title>Remover ligação</title></path>'});
sv.innerHTML=h}
document.addEventListener('click',event=>{app.querySelectorAll('details.menu[open],details.note-menu[open]').forEach(menu=>{if(!menu.contains(event.target))menu.open=false})});
app.addEventListener('toggle',event=>{if(event.target.matches('details.menu')&&event.target.open)app.querySelectorAll('details.menu[open],details.note-menu[open]').forEach(menu=>{if(menu!==event.target)menu.open=false})},true);
window.addEventListener('resize',drawLinks);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawLinks);
contentBind();
render();
if(HOSTED){
  window.addEventListener('message',event=>{
    if(event.source!==window.parent||event.origin!==location.origin||event.data?.boBlueprintHost!==1)return;
    if(event.data.history){H=event.data.history;const u=app.querySelector('[data-act="undo"]'),r=app.querySelector('[data-act="redo"]');if(u)u.disabled=!H.canUndo;if(r)r.disabled=!H.canRedo}
    if(event.data.type==='saved-view-result'){viewsResult(event.data);return}
    if(event.data.type==='context-result'){contextResult(event.data);return}
    if(event.data.type==='plan-result'){growthPlanResult(event.data);return}
    if(event.data.type==='saved'){if(!event.data.ok)growthLastPatch='';if(event.data.plans)S.plans=event.data.plans;if(event.data.painContexts)S.painContexts=event.data.painContexts;if(event.data.serviceElements){S.serviceElements=event.data.serviceElements;pickerRefreshReferences()}announceSave(event.data.ok);return}
    if(event.data.type==='hydrate'){
      applyingHost=true;
      try{
        const state=event.data.state;
        if(!state||!Array.isArray(state.steps)||typeof state.c!=='object')throw Error('Invalid host state');
        S=JSON.parse(JSON.stringify(state));S.id='host';DB={cur:'host',js:[S]};
        last=JSON.stringify(S);U=[];R=[];lib=false;dr='';cv=false;V=viewState(S.view);H=S.history||H;growthEmotionDrafts.clear();growthLastPatch=growthPatchKey();saveLabel='Salvo neste navegador';document.title='Blue Ocean · '+(S.editorKind==='blueprint'?'Blueprint':'Jornada');render();app.inert=false;app.setAttribute('aria-busy','false');
      }catch(e){console.error('Blueprint: cannot hydrate service graph',e)}
      finally{applyingHost=false}
    }
  });
  window.parent.postMessage({boBlueprintHost:1,type:'ready'},location.origin);
}
</script>
